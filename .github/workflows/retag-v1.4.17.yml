name: Retag v1.4.17 to final maintenance state

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retag-v1.4.17.yml

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "Marcin Kowalik"
          git config user.email "mkowalik@agh.edu.pl"

      - name: Replace v1.4.17 release and tag at final main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v1.4.17" >/dev/null 2>&1; then
            gh release delete "v1.4.17" --cleanup-tag --yes
          else
            git push origin :refs/tags/v1.4.17 || true
          fi

          git tag -a "v1.4.17" -m "Zortrax Inventure + OrcaSlicer integration v1.4.17"
          git push origin "v1.4.17"

          gh release create "v1.4.17"             --title "Zortrax Inventure + OrcaSlicer integration v1.4.17"             --notes-file RELEASE_NOTES_v1.4.17.md
